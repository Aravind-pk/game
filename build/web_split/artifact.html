html, body, #canvas {

#status, #status-splash, #status-progress {

#status {

	visibility: hidden;

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;

	z-index: 1;

:root { --bg: #0f1722; --panel: #18222d; --ink: #ffffff; --muted: #a9b6c3; --amber: #f5c56b;
  --line: #3a4757; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg) !important; color: var(--ink); }
#status { background: var(--bg) !important; font-family: "Barlow", system-ui, sans-serif; gap: 18px; }
#status-progress { accent-color: var(--amber); }
#status-notice { color: var(--muted) !important; background: transparent !important; border: 0 !important;
  font: 600 15px/1.4 "Barlow", system-ui, sans-serif; text-align: center; padding: 0 16px; }
#ng-brand { font: 800 40px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .04em;
  text-transform: uppercase; color: var(--ink); }
#ng-brand span { color: var(--amber); }
/* Fit the game inside the phone's safe area (the host pads :root by the insets; a canvas
   sized to the full window would be pushed down and lose its bottom: the deploy tray). */
#canvas { position: fixed !important; left: env(safe-area-inset-left, 0px);
  top: env(safe-area-inset-top, 0px);
  width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) !important;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) !important; }
@supports not (height: 100dvh) {
  #canvas { height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) !important; }
}

// Reassemble chunked engine/pack files (host limits single files to 15 MB).
(function () {
  var PARTS = {"index.wasm": 5, "index.pck": 5};
  var TYPES = {"index.wasm": "application/wasm", "index.pck": "application/octet-stream"};
  var status = null;
  var realFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    var url = typeof input === "string" ? input : input.url;
    var clean = url.split("?")[0];
    var name = Object.keys(PARTS).find(function (k) { return clean.endsWith(k); });
    if (!name) return realFetch(input, init);
    var bufs = [];
    for (var i = 0; i < PARTS[name]; i++) {
      status = status || document.getElementById("status-notice");
      if (status) { status.textContent = "Loading " + name + " (" + (i + 1) + "/" + PARTS[name] + ")"; status.style.display = "block"; }
      var r = await realFetch(name + ".part" + i + ".wasm");
      if (!r.ok) throw new Error("Missing chunk " + name + ".part" + i);
      bufs.push(await r.arrayBuffer());
    }
    if (status) status.style.display = "none";
    var blob = new Blob(bufs, { type: TYPES[name] });
    return new Response(blob, { status: 200, headers: { "Content-Type": TYPES[name], "Content-Length": String(blob.size) } });
  };
})();
</script>
<script>
// Size the canvas backing store to its CSS box (Godot resize policy "none" follows it).
(function () {
  function fit() {
    var c = document.getElementById("canvas");
    if (!c) return;
    var r = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(c.clientWidth * r)), h = Math.max(1, Math.round(c.clientHeight * r));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }
  window.addEventListener("resize", fit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  setInterval(fit, 500);
  fit();
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":47106160,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
